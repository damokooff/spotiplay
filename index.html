<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spotifry</title>

<style>
body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background-color: #121212;
    color: white;
    display: flex;
}

/* SIDEBAR */
.sidebar {
    width: 220px;
    background-color: #000;
    height: 100vh;
    padding: 20px;
    display: flex;
    flex-direction: column;
}

.logo {
    width: 160px;
    margin-bottom: 30px;
}

.menu button {
    background: none;
    border: none;
    color: #b3b3b3;
    font-size: 16px;
    text-align: left;
    padding: 12px 0;
    cursor: pointer;
    transition: 0.2s;
}

.menu button:hover {
    color: white;
}

/* MAIN CONTENT */
.main {
    flex: 1;
    padding: 40px;
    overflow-y: auto;
}

h1 {
    margin-top: 0;
}

.content {
    display: none;
    flex-direction: column;
    gap: 20px;
}

iframe {
    border-radius: 12px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.6);
}

/* ACTIVE BUTTON */
.active {
    color: #1DB954 !important;
}

/* Responsive */
@media (max-width: 768px) {
    .sidebar {
        width: 70px;
        align-items: center;
    }

    .menu button {
        font-size: 0;
    }

    .menu button::before {
        font-size: 20px;
    }
}
</style>
</head>

<body>

<div class="sidebar">
    <img src="699a447c9c4d8.png" class="logo">

    <div class="menu">
        <button onclick="showSection('playlists', this)">🎶 Playlists</button>
        <button onclick="showSection('memes', this)">🔥 Memes</button>
    </div>
</div>

<div class="main">
    <h1>Bienvenue sur Spotifry</h1>

    <div id="playlists" class="content">
        <p>Playlists à venir...</p>
    </div>

    <div id="memes" class="content">

        <iframe src="https://open.spotify.com/embed/track/6Wgv1gBq2gOnLqSp7BKsbj"
        width="100%" height="152" frameBorder="0"
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>

        <iframe src="https://open.spotify.com/embed/track/4PTG3Z6ehGkBFwjybzWkR8"
        width="100%" height="152" frameBorder="0"
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>

        <iframe src="https://open.spotify.com/embed/track/4v7xzLzIiO3FRblkgnilLq"
        width="100%" height="152" frameBorder="0"
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>

    </div>
</div>

<script>
function showSection(sectionId, btn) {
    document.getElementById("playlists").style.display = "none";
    document.getElementById("memes").style.display = "none";

    document.getElementById(sectionId).style.display = "flex";

    document.querySelectorAll(".menu button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
}

showSection('memes', document.querySelectorAll(".menu button")[1]);
</script>

</body>
</html>
