<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Ma Playlist Spotify</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #121212, #1DB954);
            color: white;
            text-align: center;
        }

        header {
            padding: 40px 20px;
        }

        h1 {
            margin: 0;
            font-size: 2.5em;
        }

        .container {
            max-width: 800px;
            margin: 0 auto 60px auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        iframe {
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
            transition: transform 0.2s ease;
        }

        iframe:hover {
            transform: scale(1.02);
        }

        footer {
            padding: 20px;
            font-size: 0.9em;
            opacity: 0.8;
        }
    </style>
</head>

<body>

<header>
    <h1>🎧 Ma Sélection Musicale</h1>
    <p>Écoute mes morceaux préférés directement ici</p>
</header>

<div class="container">
