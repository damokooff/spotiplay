<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spotifry</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background-color: #121212;
    color: white;
    display: flex;
}

/* ===== SIDEBAR ===== */
.sidebar {
    width: 240px;
    background-color: #000;
    height: 100vh;
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
}

.logo {
    width: 180px;
    margin-bottom: 40px;
}

.nav-btn {
    background: none;
    border: none;
    color: #b3b3b3;
    font-size: 15px;
    text-align: left;
    padding: 12px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
    transition: all 0.2s ease;
    display: block;
    width: 100%;
}

.nav-btn:hover {
    background-color: #1a1a1a;
    color: white;
}

.nav-btn.active {
    background-color: #282828;
    color: white;
}

/* ===== MAIN ===== */
.main {
    flex: 1;
    background: linear-gradient(to bottom, #1f1f1f, #121212);
    padding: 40px;
    overflow-y: auto;
}

h1 {
    font-size: 28px;
    margin-bottom: 30px;
}

/* ===== CONTENT ===== */
.content {
    display: none;
    flex-direction: column;
    gap: 20px;
}

iframe {
    width: 100%;
    height: 152px;
    border: none;
    border-radius: 12px;
}

/* ===== SCROLLBAR STYLE ===== */
::-webkit-scrollbar {
    width: 8px;
}

::-webkit-scrollbar-thumb {
    background: #2a2a2a;
    border-radius: 4px;
}

::-webkit-scrollbar-thumb:hover {
    background: #1DB954;
}

/* ===== RESPONSIVE ===== */
@media (max-width: 900px) {
    .sidebar {
        width: 80px;
    }

    .nav-btn {
        font-size: 0;
    }

    .logo {
        width: 50px;
    }
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <img src="https://i.imgur.com/V8Om3RI.png" class="logo">

    <button class="nav-btn" onclick="showSection('playlists', this)">🎵 Playlists</button>
    <button class="nav-btn" onclick="showSection('memes', this)">🔥 Memes</button>
</div>

<!-- MAIN -->
<div class="main">

    <h1>Spotifry</h1>

    <div id="playlists" class="content">
        <p style="color:#b3b3b3;">Playlists bientôt disponibles...</p>
    </div>

    <div id="memes" class="content">

        <iframe src="https://open.spotify.com/embed/track/6Wgv1gBq2gOnLqSp7BKsbj"></iframe>
        <iframe src="https://open.spotify.com/embed/track/4PTG3Z6ehGkBFwjybzWkR8"></iframe>
        <iframe src="https://open.spotify.com/embed/track/4v7xzLzIiO3FRblkgnilLq"></iframe>
        <iframe src="https://open.spotify.com/embed/track/72ruQY6f8MsWotV4xFCjI5"></iframe>
        <iframe src="https://open.spotify.com/embed/track/3SwxApSUH2PzTkw4NRlATO"></iframe>

    </div>

</div>

<script>
function showSection(sectionId, btn) {
    document.getElementById("playlists").style.display = "none";
    document.getElementById("memes").style.display = "none";

    document.getElementById(sectionId).style.display = "flex";

    document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
}

showSection("memes", document.querySelectorAll(".nav-btn")[1]);
</script>

</body>
</html>
