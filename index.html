<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mon Site Musical</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #121212, #1DB954);
            color: white;
            text-align: center;
        }

        header {
            padding: 40px 20px 20px 20px;
        }

        h1 {
            margin: 0;
            font-size: 2.5em;
        }

        .buttons {
            margin: 30px 0;
        }

        button {
            padding: 12px 25px;
            margin: 10px;
            border: none;
            border-radius: 25px;
            font-size: 1em;
            cursor: pointer;
            background-color: white;
            color: #121212;
            font-weight: bold;
            transition: 0.2s ease;
        }

        button:hover {
            transform: scale(1.05);
            background-color: #1DB954;
            color: white;
        }

        .content {
            display: none;
            max-width: 800px;
            margin: 0 auto 60px auto;
            padding: 20px;
            flex-direction: column;
            gap: 25px;
        }

        iframe {
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
            border-radius: 12px;
        }

        footer {
            padding: 20px;
            font-size: 0.9em;
            opacity: 0.8;
        }
    </style>
</head>

<body>

<header>
    <h1>🎧 Mon Univers</h1>
</header>

<div class="buttons">
    <button onclick="showSection('playlists')">Playlists</button>
    <button onclick="showSection('memes')">Memes</button>
</div>

<!-- SECTION PLAYLISTS (vide pour l’instant) -->
<div id="playlists" class="content">
    <h2>🎶 Playlists</h2>
    <p>Contenu à venir...</p>
</div>

<!-- SECTION MEMES (tes embeds ici) -->
<div id="memes" class="content">

    <iframe src="https://open.spotify.com/embed/track/6Wgv1gBq2gOnLqSp7BKsbj?utm_source=generator"
        width="100%" height="152" frameBorder="0"
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
        loading="lazy"></iframe>

    <iframe src="https://open.spotify.com/embed/track/4PTG3Z6ehGkBFwjybzWkR8?utm_source=generator"
        width="100%" height="152" frameBorder="0"
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
        loading="lazy"></iframe>

    <iframe src="https://open.spotify.com/embed/track/4v7xzLzIiO3FRblkgnilLq?utm_source=generator"
        width="100%" height="152" frameBorder="0"
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
        loading="lazy"></iframe>

    <iframe src="https://open.spotify.com/embed/track/72ruQY6f8MsWotV4xFCjI5?utm_source=generator"
        width="100%" height="152" frameBorder="0"
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
        loading="lazy"></iframe>

    <iframe src="https://open.spotify.com/embed/track/3SwxApSUH2PzTkw4NRlATO?utm_source=generator"
        width="100%" height="152" frameBorder="0"
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
        loading="lazy"></iframe>

</div>

<footer>
    © 2026 - Site personnalisé
</footer>

<script>
    function showSection(sectionId) {
        document.getElementById("playlists").style.display = "none";
        document.getElementById("memes").style.display = "none";

        document.getElementById(sectionId).style.display = "flex";
    }

    // Afficher memes par défaut
    showSection('memes');
</script>

</body>
</html>
